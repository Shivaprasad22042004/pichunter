services:
  - type: web
    name: graduation-photo-finder
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: ORT_THREADS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

      # --- usage counting -------------------------------------------------
      # STATS_SECRET: any long random string. Changing it only changes how the
      #   visitor hashes look, not the counts.
      - key: STATS_SECRET
        generateValue: true

      # Durable counter storage. The free Render web service has an ephemeral
      # filesystem and the free Render Key Value is in-memory, so without an
      # external database the counts reset whenever the service restarts.
      # Create a free Upstash Redis database (500k commands/month) and paste
      # its REST URL and token below.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # EXCLUDE_IPS: comma-separated IPs that are never counted (e.g. yours).
      - key: EXCLUDE_IPS
        sync: false

      # --- website --------------------------------------------------------
      # Public address, used in sitemap.xml and robots.txt.
      - key: SITE_URL
        value: https://graduation-photo-finder.onrender.com
      # Optional: the verification code Search Console gives you.
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
